# @gongshiyun/dsh-theme-claude-desktop 的 bundle 补丁层（host 组合插入）。
#
# 被 dsh.profile.bundles 引用时，把本插件作为一条组合条目插入到 dsh profile 的
# 组合树里。条目本身没有可配置项：主题的取值全部在 client 半边
# （lib/client.js）里，改配色/字体直接改那份文件即可。
#
# 如果只想在某个 profile 里临时启用，也可以把下面这段原样抄到该 profile 的
# cordis.patch.yml 顶层：
#
#   - insert:
#       - id: theme-claude-desktop
#         name: '@gongshiyun/dsh-theme-claude-desktop'
#
- insert:
    - id: theme-claude-desktop
      name: '@gongshiyun/dsh-theme-claude-desktop'
